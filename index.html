<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f0f">
    <title>ytshelves</title>

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.add("light");
      }
    </script>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <header>
      <!-- Row 1: theme + narrow toggles on the left, Folders + Sign in on the right -->
      <div class="button-bar">
        <button id="theme" title="Light/dark theme">☀</button>
        <button id="narrow" title="Phone width">↔</button>
        <span class="spacer"></span>
        <button id="manage">Folders</button>
        <button id="login">Sign in</button>
      </div>

      <!-- Row 2: folder tabs on the left, feed controls on the right -->
      <div class="tabs-row">
        <div id="tabs"></div>
        <div class="controls">
          <div class="control-group">
            <span class="caption">Channel</span>
            <select id="channel-filter" style="display:none"></select>
          </div>
          <div class="control-group">
            <span class="caption">Sort</span>
            <select id="sort">
              <option value="recent">Recent</option>
              <option value="popular">Popular</option>
            </select>
          </div>
          <div class="control-group">
            <span class="caption">View</span>
            <button id="view">List</button>
          </div>
          <div class="control-group">
            <span class="caption">Include</span>
            <button id="shorts">Shorts</button>
          </div>
        </div>
      </div>
    </header>

    <div id="manager"></div>
    <div id="all-view"></div>
    <div id="status"></div>
    <div id="feed" class="grid"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js"></script>
    <script src="js/util.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/youtube.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/views.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>

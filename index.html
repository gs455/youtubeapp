<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f"><title>SubShelf</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#eee;font:13px -apple-system,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;background:#0f0f0f;z-index:5;border-bottom:1px solid #222}
.bar{display:flex;gap:6px;align-items:center;padding:4px 6px}
button,select{background:#222;color:#eee;border:1px solid #333;border-radius:6px;padding:4px 8px;font-size:12px}
#tabs{display:flex;overflow-x:auto;gap:4px;padding:4px 6px}#tabs button{white-space:nowrap}#tabs .on{background:#c00;border-color:#c00}
#feed.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;padding:6px}
.v{display:block;color:inherit;text-decoration:none}.t{position:relative}.t img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}
.d{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.85);font-size:11px;padding:1px 4px;border-radius:3px}
.ti{font-size:12px;line-height:1.25;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.m{color:#999;font-size:11px}
#feed.list .v{display:flex;gap:6px;align-items:center;padding:2px 6px;border-bottom:1px solid #1a1a1a}
#feed.list .t{width:72px;flex:none}#feed.list .t img{border-radius:3px}#feed.list .d{font-size:10px;right:2px;bottom:2px;padding:0 3px}
#feed.list .ti{-webkit-line-clamp:1;flex:1;margin:0}#feed.list .m{white-space:nowrap}
#mgr{display:none;padding:6px}#mgr.show{display:block}.ch{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #1a1a1a}.ch img{width:24px;height:24px;border-radius:50%}.ch span{flex:1}
.ch span,.ch .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eee;text-decoration:none}.ch button{padding:2px 6px}.fd summary{padding:3px 0;cursor:pointer}.fd .fd{margin-left:8px}.cl{display:block;padding:2px 0 2px 16px;color:#8ab4f8;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{color:#999;padding:6px}
</style></head><body>
<header><div class="bar"><b>SubShelf</b><span style="flex:1"></span>
<select id="sort"><option value="recent">Recent</option><option value="popular">Popular</option></select>
<button id="shorts">Shorts: hidden</button><button id="view">List</button><button id="manage">Folders</button><button id="login">Sign in</button></div>
<div id="tabs"></div></header>
<div id="mgr"></div><div id="st"></div><div id="feed" class="grid"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
